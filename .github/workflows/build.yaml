name: Build font and check with Font Bakery
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt fontbakery[googlefonts]
      - run: cd sources && gftools builder config.yaml
      - run: fontbakery check-googlefonts fonts/ttf/*.ttf --html fontbakery-report.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            fonts
            fontbakery-report.html
